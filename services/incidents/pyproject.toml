[project]
name = "opsentra-incidents"
version = "0.5.0"
description = "Opsentra incident core, ingest and reconciler (AWS Lambda, Python 3.12)"
requires-python = "==3.12.*"
dependencies = []  # boto3 from the Lambda runtime

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501", "B017"]
