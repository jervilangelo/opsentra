[project]
name = "opsentra-health-check"
version = "0.4.0"
description = "Opsentra lab health probe (AWS Lambda, Python 3.12)"
requires-python = "==3.12.*"
dependencies = []  # stdlib + boto3 from the Lambda runtime

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]
