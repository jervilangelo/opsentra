name: terraform-plan

on:
  pull_request:
    paths: ['infrastructure/environments/control-plane-dev/**', 'infrastructure/modules/**', 'services/api/src/**']

# Short-lived OIDC credentials for a read-only role. Plans never take the state
# lock (-lock=false), so a pull request never writes to AWS (CLAUDE.md).
permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # Off until the owner sets ENABLE_TERRAFORM_PLAN=true after the first apply.
    # The role ARN, account ID and bucket all contain the account ID, so they
    # are secrets (masked in logs), never variables.
    if: vars.ENABLE_TERRAFORM_PLAN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/environments/control-plane-dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: opsentra-plan-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.17'
      - name: init
        run: >
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=control-plane-dev/terraform.tfstate"
          -backend-config="region=ap-southeast-1"
      - name: plan (read-only, no lock)
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform plan -lock=false -input=false -no-color -detailed-exitcode || [ $? -eq 2 ]
